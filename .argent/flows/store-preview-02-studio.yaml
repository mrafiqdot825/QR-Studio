executionPrerequisite: >-
  App is in Studio on the Live QR Preview screen.
steps:
  - await:
      visible:
        text: Live QR Preview
  - wait: 1500
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.75
      toX: 0.5
      toY: 0.35
      durationMs: 700
  - wait: 2500
  - echo: "Explore tab in bottom navigation bar"
  - tap:
      text: Explore
  - await:
      visible:
        text: Explore Templates
  - wait: 2000
